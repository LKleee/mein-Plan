<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mein Plan</title>
<style>
:root{--bg:#edf1ee;--card:#fbfcfb;--ink:#17262b;--mute:#62747a;--line:#d5dedb;--sport:#1f6f8b;--phd:#7a4e8c;--life:#667a2c;--soft:#e2eaea;
color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111a1d;--card:#1a262a;--ink:#e6efee;--mute:#93a6aa;--line:#2b3b40;--sport:#5fb4d1;--phd:#c39ad6;--life:#a7c15a;--soft:#223136;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111a1d;--card:#1a262a;--ink:#e6efee;--mute:#93a6aa;--line:#2b3b40;--sport:#5fb4d1;--phd:#c39ad6;--life:#a7c15a;--soft:#223136;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "Avenir Next",ui-rounded,system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:84px;overflow-x:hidden}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:1.7rem;line-height:1.15;margin:0;font-weight:700;letter-spacing:-.02em}
h2{font-size:1.05rem;margin:22px 0 8px;font-weight:700}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--sport);outline-offset:2px}
.dnav{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.dnav>div{flex:1}
.dnav p,.chip{color:var(--mute);font-size:.88rem}
.nb{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-size:1.4rem}
.stat{display:flex;gap:10px;align-items:center;margin-bottom:6px}
.bar{flex:1;height:10px;border-radius:5px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--sport);border-radius:5px;transition:width .3s}
.note{background:var(--soft);border-radius:12px;padding:12px 14px;margin:10px 0;color:var(--mute)}
.dh{display:flex;align-items:center;justify-content:space-between;margin:20px 0 6px}
.dh h2{margin:0}
.dh h2 small{font-weight:400;color:var(--mute);font-size:.88rem;margin-left:6px}
.dh.tod h2{color:var(--sport)}
.fr{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 12px;font-size:.85rem;color:var(--mute)}
.empty{color:var(--mute);font-size:.9rem;padding:2px}
.row{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:10px;padding:12px;margin-bottom:8px;cursor:pointer}
.row input{position:absolute;opacity:0;width:1px;height:1px}
.bx{flex:none;width:24px;height:24px;border-radius:7px;border:2px solid var(--c);margin-top:1px;display:grid;place-items:center}
.row input:checked+.bx{background:var(--c)}
.row input:checked+.bx::after{content:"";width:6px;height:11px;border:solid var(--card);border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.row input:focus-visible+.bx{outline:2px solid var(--ink);outline-offset:2px}
.tx{flex:1;min-width:0}
.row b{display:block;font-weight:600}
.row small{display:block;color:var(--mute);font-size:.85rem}
.row input:checked~span b{text-decoration:line-through;color:var(--mute)}
.plus{margin:-2px 0 12px 4px}
textarea{width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:.8rem}
.mv{flex:none;align-self:center;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:4px;font:inherit;font-size:.85rem}
.x{background:none;border:0;color:var(--mute);font-size:1.3rem;padding:0 6px;line-height:1;align-self:center}
.add{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.add input,.add select{flex:1;min-width:0;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit}
.add select{flex:none}
.add button{padding:0 16px;min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-weight:600}
.mg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.mh{font-size:.8rem;color:var(--mute);text-align:center;padding:4px 0}
.mc{aspect-ratio:1;border-radius:8px;border:1px solid var(--line);background:var(--card);position:relative;padding:0;display:grid;place-items:center;font-weight:600;overflow:hidden;color:var(--ink)}
.mc i{position:absolute;inset:0;background:var(--sport);opacity:var(--o,0)}
.mc span{position:relative}
.mc.tod{border:2px solid var(--ink)}
.mc.off{border-style:dashed;color:var(--mute)}
.sum{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:14px}
.sum div{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center}
.sum b{display:block;font-size:1.6rem}
.sum small{color:var(--mute);font-size:.85rem}
details{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:8px}
summary{font-weight:600;cursor:pointer}
details p,ul.t{color:var(--mute);margin:8px 0 2px}
ul.t{padding-left:18px}
ul.t li{margin-bottom:6px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;gap:8px;justify-content:center;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--line)}
nav button{flex:1;max-width:160px;padding:12px;border-radius:12px;border:1px solid var(--line);background:transparent;font-weight:600}
nav button[aria-current="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
</style>
</head>
<body>
<main id="app"></main>
<nav><button id="t1" onclick="setTab('week')">Woche</button><button id="t2" onclick="setTab('day')">Tag</button><button id="t3" onclick="setTab('month')">Monat</button><button id="t4" onclick="setTab('plan')">Plan</button></nav>
<script>
const DN=["Mo","Di","Mi","Do","Fr","Sa","So"],DL=["Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag","Sonntag"];
const COL={Sport:"var(--sport)",PhD:"var(--phd)",Alltag:"var(--life)",Eigene:"var(--mute)"};
const PLAN0=new Date(2026,10,23,12);
const mk=d=>{const x=new Date(d);x.setHours(12,0,0,0);return x};
const addD=(d,n)=>{const x=mk(d);x.setDate(x.getDate()+n);return x};
const monday=d=>addD(d,-((mk(d).getDay()+6)%7));
const key=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const wIdx=m=>Math.max(0,Math.round((m-PLAN0)/604800000));
const fmt=(d,o)=>d.toLocaleDateString("de-DE",o);
const MONTHLY=[["m1","Konferenz- und Förderfristen prüfen"],["m2","Eine Person aus dem Feld anschreiben"],["m3","Backup und Datenordner prüfen"],["m4","Zotero aufräumen und Tags pflegen"]];
let S={wd:{},mv:{},wx:{},off:{},mt:{}};
try{const r=localStorage.getItem("plan_v2");if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem("plan_v2",JSON.stringify(S))}catch(e){}};
const T0=mk(new Date())<PLAN0?PLAN0:new Date();
let cw=monday(T0),cd=mk(T0),vm=mk(new Date()),tab="week";vm.setDate(1);

function nums(w){
 const b=Math.floor(w/4),de=w%4===3,P=[10,12,14,16,18,20,22,22,26,30,32][Math.min(b,10)];
 const L=w>=46?0:w>=43?[22,18,12][w-43]:(de?Math.round(P*.7):P-2+w%4);
 const E=Math.min(10,5+Math.floor(b/2))-(de?1:0),T=Math.min(11,6+Math.floor(b/2))-(de?1:0);
 const B=Math.round(Math.min(90,50+3*b)*(de?.7:1)/5)*5,S=Math.round((Math.min(2000,1500+50*b)-(de?250:0))/50)*50;
 const ph=w<12?"Basis":w<20?"Aufbau":w<30?"Triathlon-Phase":w<43?"Marathon-Block":"Taper";
 return{b,de,L,E,T,B,S,ph};
}
function base(m){
 const n=nums(wIdx(m)),a=[];
 const KR="10 Min Kraft-Warm-up vorher (Kniebeugen, Ausfallschritte, Glute Bridge, Plank, Wadenheben). ";
 const run=(id,day,t,d)=>a.push({id,g:"Sport",t,d:KR+d,day});
 run("run-tempo",1,"Tempo-Lauf, "+n.T+" km","1 km einlaufen, "+(n.T-2)+" × 1 km zügig mit je 90 Sek Trabpause, 1 km auslaufen");
 a.push({id:"swim",g:"Sport",t:"Schwimmen, "+n.S+" m",d:"Einschwimmen, dann Ausdauer in Blöcken von 200 bis 400 m",day:2});
 run("run-easy",4,"Lockerer Lauf, "+n.E+" km","Tempo, bei dem du dich unterhalten könntest");
 a.push({id:"bike",g:"Sport",t:"Rad, ca. "+n.B+" km",d:"Locker bis moderat, Essen und Trinken üben",day:5});
 if(n.L)run("run-long",6,"Langer Lauf, "+n.L+" km","Ruhig, lieber zu langsam als zu schnell"+(n.L>=16?". Ab 16 km unterwegs Kohlenhydrate trinken oder essen":""));
 for(let i=0;i<5;i++){
  const dp=i===0||i===3;
  a.push({id:"paper-"+i,g:"PhD",t:dp?"Paper gründlich lesen":"Paper querlesen",d:dp?"Frage, Methode, Ergebnis, Grenzen. 5 Zeilen Notiz in Zotero":"Abstract, Methoden, Ergebnisse. 3 Zeilen Notiz in Zotero",day:i});
  a.push({id:"write-"+i,g:"PhD",t:"Schreiben, 25 Min",d:"Rohtext zählt: Notizen, Entwurf, Literaturreview",day:i});
  a.push({id:"planlog-"+i,g:"PhD",t:"Tagesplan und Forschungslog, 8 Min",d:"Morgens 1 bis 3 Aufgaben, abends 3 Sätze: gemacht, entschieden, gelernt",day:i});
 }
 [0,3,6].forEach(i=>a.push({id:"methods-"+i,g:"PhD",t:"Methoden lernen, 50 Min",d:"Python (pandas, statsmodels), am besten mit eigenen Daten",day:i}));
 a.push({id:"review",g:"PhD",t:"Wochenrückblick, 15 Min",d:"Was lief gut, Stand und Fragen fürs Betreuergespräch, nächster Schritt",day:4});
 a.push({id:"weekplan",g:"PhD",t:"Woche planen, 10 Min",d:"Termine, Deadlines, Schwerpunkt der Woche",day:6});
 [0,1,2,3,4,6].forEach(i=>a.push({id:"news-"+i,g:"Alltag",t:"Nachrichten, 15 Min",d:"",day:i}));
 return a;
}
const TO=["run","swim","bike","paper","write","planlog","methods","review","weekplan","news"];
const ty=x=>x.ty||x.id.split("-")[0];
const ti=x=>{const i=TO.indexOf(ty(x));return i<0?99:i};
function items(m){
 const k=key(m),mv=S.mv[k]||{},G=["Sport","PhD","Alltag","Eigene"];
 const a=(m<PLAN0?[]:base(m)).concat((S.wx[k]||[]).map(x=>({id:x.id,g:x.g||"Eigene",t:x.t,d:x.d||"",day:x.day,ty:x.ty,own:1})));
 return a.filter(x=>mv[x.id]!==-2&&(mv[x.id]!=null||x.own||!S.off[key(addD(m,x.day))])).map(x=>({...x,day:mv[x.id]!=null?mv[x.id]:x.day})).sort((p,q)=>G.indexOf(p.g)-G.indexOf(q.g)||ti(p)-ti(q)||(p.day<0?9:p.day)-(q.day<0?9:q.day));
}
function addLike(id){const it=items(cw).find(x=>x.id===id);if(!it)return;const k=key(cw);S.wx[k]=[...(S.wx[k]||[]),{id:"x"+Date.now(),g:it.g,t:it.t,d:it.d,day:-1,ty:ty(it)}];save();render()}
function bkx(){document.getElementById("bk").value=JSON.stringify(S)}
function bki(){try{const o=JSON.parse(document.getElementById("bk").value);S=Object.assign({wd:{},mv:{},wx:{},off:{},mt:{}},o);save();render()}catch(e){alert("Das hat nicht geklappt. Bitte den kompletten Text einfügen.")}}
function tg(id){const k=key(cw),a=S.wd[k]||[];S.wd[k]=a.includes(id)?a.filter(x=>x!==id):[...a,id];save();render()}
function mvI(id,v){v=+v;const k=key(cw),wx=S.wx[k]||[],o=wx.find(x=>x.id===id);
 if(v===7){const nk=key(addD(cw,7)),it=o||base(cw).find(x=>x.id===id);if(!it)return;
  S.wx[nk]=[...(S.wx[nk]||[]),{id:"c"+Date.now(),g:it.g,t:it.t,d:it.d||"",day:-1,ty:ty(it)}];
  if(o)S.wx[k]=wx.filter(x=>x.id!==id);else{S.mv[k]=S.mv[k]||{};S.mv[k][id]=-2}
  S.wd[k]=(S.wd[k]||[]).filter(x=>x!==id)}
 else if(o)o.day=v;
 else{const b=base(cw).find(x=>x.id===id);S.mv[k]=S.mv[k]||{};if(b&&b.day===v)delete S.mv[k][id];else S.mv[k][id]=v}
 save();render()}
function ax(){const v=document.getElementById("xin").value.trim();if(!v)return;const k=key(cw);
 S.wx[k]=[...(S.wx[k]||[]),{id:"x"+Date.now(),g:document.getElementById("xg").value,t:v,d:"",day:+document.getElementById("xd").value}];save();render()}
function dx(id){const k=key(cw);S.wx[k]=(S.wx[k]||[]).filter(x=>x.id!==id);S.wd[k]=(S.wd[k]||[]).filter(x=>x!==id);save();render()}
function tf(dk){if(S.off[dk])delete S.off[dk];else S.off[dk]=1;save();render()}
function tw(){const ds=[0,1,2,3,4,5,6].map(i=>key(addD(cw,i))),all=ds.every(d=>S.off[d]);ds.forEach(d=>{if(all)delete S.off[d];else S.off[d]=1});save();render()}
function wn(n){const i=(cd.getDay()+6)%7;cw=addD(cw,7*n);cd=addD(cw,i);render()}
function dnv(n){cd=addD(cd,n);cw=monday(cd);render()}
function setTab(t){tab=t;render();window.scrollTo(0,0)}
function wrow(x,dn){
 const sel=(x.day>=0?x.day:-1);
 return `<label class="row" style="--c:${COL[x.g]}"><input type="checkbox" ${dn.includes(x.id)?"checked":""} onchange="tg('${x.id}')"><span class="bx"></span><span class="tx"><b>${x.t}</b>${x.d?`<small>${x.d}</small>`:""}</span><select class="mv" aria-label="Tag ändern oder verschieben" onchange="mvI('${x.id}',this.value)">${DN.map((d,j)=>`<option value="${j}" ${j===sel?"selected":""}>${d}</option>`).join("")}<option value="-1" ${sel===-1?"selected":""}>ohne Tag</option><option value="7">nächste Woche</option></select>${x.own?`<button class="x" onclick="event.preventDefault();dx('${x.id}')" aria-label="Entfernen">×</button>`:""}</label>`;
}
function addForm(dd){return `<div class="add"><input id="xin" placeholder="Eigene Aufgabe hinzufügen" aria-label="Eigene Aufgabe" onkeydown="if(event.key==='Enter')ax()"><select id="xg" aria-label="Bereich"><option>Sport</option><option>PhD</option><option>Alltag</option></select><select id="xd" aria-label="Tag">${DN.map((d,j)=>`<option value="${j}" ${j===dd?"selected":""}>${d}</option>`).join("")}<option value="-1" ${dd===-1?"selected":""}>ohne Tag</option></select><button onclick="ax()">Hinzufügen</button></div>`}
function week(){
 const m=cw,k=key(m),I=items(m),dn=S.wd[k]||[],n=nums(wIdx(m)),tot=I.length,dd=I.filter(x=>dn.includes(x.id)).length;
 const allOff=[0,1,2,3,4,5,6].every(i=>S.off[key(addD(m,i))]),G=["Sport","PhD","Alltag","Eigene"],GL={Sport:"Sport",PhD:"PhD",Alltag:"Alltag",Eigene:"Sonstiges"};
 const free=[0,1,2,3,4,5,6].filter(i=>S.off[key(addD(m,i))]).map(i=>DN[i]);
 let h=`<div class="dnav"><button class="nb" onclick="wn(-1)" aria-label="Vorwoche">‹</button><div><h1>${fmt(m,{day:"numeric",month:"short"})} bis ${fmt(addD(m,6),{day:"numeric",month:"short"})}</h1><p>${n.ph}${n.de?", Entlastungswoche":""}${key(m)===key(monday(new Date()))?", diese Woche":""}</p></div><button class="nb" onclick="wn(1)" aria-label="Folgewoche">›</button></div>`;
 h+=`<div class="stat"><div class="bar"><i style="width:${tot?Math.round(dd/tot*100):0}%"></i></div><span class="chip">${dd} von ${tot}</span></div>`;
 h+=`<p class="chip">Läufe: lang ${n.L?n.L+" km":"frei"}, Tempo ${n.T} km, locker ${n.E} km. Rad ca. ${n.B} km, Schwimmen ${n.S} m.</p>`;
 h+=`<p style="margin-top:8px"><button class="fr" onclick="tw()">${allOff?"Freie Woche rückgängig":"Ganze Woche frei"}</button>${free.length&&!allOff?` <span class="chip">Frei: ${free.join(", ")}</span>`:""}</p>`;
 if(allOff)h+=`<div class="note">Freie Woche. Es gibt nichts nachzuholen, der Plan läuft danach einfach weiter.</div>`;
 if(m<PLAN0)h+=`<div class="note">Der Plan startet am Montag, 23. November. Bis dahin ist nichts geplant. Eigene Aufgaben kannst du trotzdem anlegen.</div>`;
 G.forEach(g=>{const L=I.filter(x=>x.g===g&&!dn.includes(x.id));if(!L.length)return;
  h+=`<h2 style="color:${COL[g]}">${GL[g]}</h2>`;
  L.forEach((x,i)=>{h+=wrow(x,dn);const nx=L[i+1];if((g==="PhD"||g==="Alltag")&&(!nx||ty(nx)!==ty(x)))h+=`<button class="fr plus" onclick="addLike('${x.id}')">+ noch eins</button>`})});
 const D=I.filter(x=>dn.includes(x.id));
 if(D.length)h+=`<h2>Erledigt</h2>`+D.map(x=>wrow(x,dn)).join("");
 h+=addForm(-1);
 return h;
}
function day(){
 const d=cd,m=monday(d),k=key(m),i=(d.getDay()+6)%7,dk=key(d),off=S.off[dk],I=items(m),dn=S.wd[k]||[];
 const L=I.filter(x=>x.day===i),O=L.filter(x=>!dn.includes(x.id)),D=L.filter(x=>dn.includes(x.id)),U=I.filter(x=>x.day===-1&&!dn.includes(x.id));
 let h=`<div class="dnav"><button class="nb" onclick="dnv(-1)" aria-label="Vortag">‹</button><div><h1>${DL[i]}</h1><p>${fmt(d,{day:"numeric",month:"long"})}${dk===key(new Date())?", heute":""}</p></div><button class="nb" onclick="dnv(1)" aria-label="Folgetag">›</button></div>`;
 h+=`<div class="stat"><div class="bar"><i style="width:${L.length?Math.round(D.length/L.length*100):0}%"></i></div><span class="chip">${D.length} von ${L.length}</span><button class="fr" onclick="tf('${dk}')">${off?"Frei, rückgängig":"Frei"}</button></div>`;
 if(off&&!L.length)h+=`<div class="note">Freier Tag. Nichts zu tun.</div>`;
 else if(!L.length)h+=`<p class="empty">${m<PLAN0?"Der Plan startet am Montag, 23. November.":"Für diesen Tag ist nichts geplant."}</p>`;
 h+=O.map(x=>wrow(x,dn)).join("");
 if(D.length)h+=`<h2>Erledigt</h2>`+D.map(x=>wrow(x,dn)).join("");
 if(U.length)h+=`<h2>Diese Woche noch ohne Tag</h2>`+U.map(x=>wrow(x,dn)).join("");
 h+=addForm(i);
 return h;
}
function dayStat(d){const m=monday(d),i=(d.getDay()+6)%7,dn=S.wd[key(m)]||[],L=items(m).filter(x=>x.day===i);return{t:L.length,d:L.filter(x=>dn.includes(x.id))}}
function mv2(n){vm=new Date(vm.getFullYear(),vm.getMonth()+n,1,12);render()}
function pickD(dk){const[a,b,c]=dk.split("-").map(Number);cd=new Date(a,b-1,c,12);cw=monday(cd);tab="day";render();window.scrollTo(0,0)}
function mlist(y){if(!S.mt[y]){S.mt[y]=MONTHLY.map(([id,t])=>({id:id+y,t,done:false}));save()}return S.mt[y]}
function mtg(id){const l=mlist(key(vm).slice(0,7)),o=l.find(x=>x.id===id);if(o)o.done=!o.done;save();render()}
function mdx(id){const y=key(vm).slice(0,7);S.mt[y]=mlist(y).filter(x=>x.id!==id);save();render()}
function ma(){const v=document.getElementById("min").value.trim();if(!v)return;mlist(key(vm).slice(0,7)).push({id:"t"+Date.now(),t:v,done:false});save();render()}
function fr(){const a=document.getElementById("f1").value,b=document.getElementById("f2").value||a;if(!a)return;
 let d=mk(new Date(a+"T12:00:00")),e=mk(new Date(b+"T12:00:00"));for(let i=0;d<=e&&i<90;i++){S.off[key(d)]=1;d=addD(d,1)}save();render()}
function month(){
 const y=vm.getFullYear(),mo=vm.getMonth(),n=new Date(y,mo+1,0).getDate(),first=(new Date(y,mo,1).getDay()+6)%7,mn=fmt(vm,{month:"long"}),ymk=key(vm).slice(0,7);
 let sess=0,pap=0,meth=0,fre=0,g=DN.map(d=>`<div class="mh">${d}</div>`).join("");
 for(let i=0;i<first;i++)g+="<div></div>";
 for(let d=1;d<=n;d++){const dt=new Date(y,mo,d,12),dk=key(dt),st=dayStat(dt),off=S.off[dk],dn=st.d;
  sess+=dn.filter(x=>x.g==="Sport").length;pap+=dn.filter(x=>x.id.startsWith("paper")).length;meth+=dn.filter(x=>x.id.startsWith("methods")).length;if(off)fre++;
  g+=`<button class="mc ${dk===key(new Date())?"tod":""} ${off?"off":""}" style="--o:${dn.length?(.15+dn.length/st.t*.5).toFixed(2):0}" onclick="pickD('${dk}')" aria-label="${d}. ${mn}${off?", frei":""}"><i></i><span>${d}</span></button>`}
 const L=mlist(ymk);
 let h=`<div class="dnav"><button class="nb" onclick="mv2(-1)" aria-label="Vormonat">‹</button><div><h1>${mn}</h1><p>${y}</p></div><button class="nb" onclick="mv2(1)" aria-label="Folgemonat">›</button></div><div class="mg">${g}</div>`;
 h+=`<p class="chip" style="margin-top:8px">Je dunkler ein Tag, desto mehr hast du geschafft. Gestrichelt sind freie Tage. Tippe auf einen Tag, um den Tag zu öffnen.</p>`;
 h+=`<div class="sum"><div><b>${sess}</b><small>Sporteinheiten</small></div><div><b>${pap}</b><small>Paper</small></div><div><b>${meth}</b><small>Methoden-Blöcke</small></div><div><b>${fre}</b><small>Freie Tage</small></div></div>`;
 h+=`<h2>Aufgaben für ${mn}</h2>`+L.map(x=>`<label class="row" style="--c:var(--phd)"><input type="checkbox" ${x.done?"checked":""} onchange="mtg('${x.id}')"><span class="bx"></span><span class="tx"><b>${x.t}</b></span><button class="x" onclick="event.preventDefault();mdx('${x.id}')" aria-label="Entfernen">×</button></label>`).join("");
 h+=`<div class="add"><input id="min" placeholder="Neue Aufgabe für den Monat" aria-label="Neue Monatsaufgabe" onkeydown="if(event.key==='Enter')ma()"><button onclick="ma()">Hinzufügen</button></div>`;
 h+=`<h2>Urlaub oder freie Tage eintragen</h2><div class="add"><input type="date" id="f1" aria-label="Von"><input type="date" id="f2" aria-label="Bis"><button onclick="fr()">Eintragen</button></div>`;
 return h;
}
function plan(){
 const n=nums(wIdx(cw));
 return `<h1>Plan und Beratung</h1><p class="chip" style="margin:6px 0 12px">Der Plan startet am Montag, 23. November 2026. Diese Woche: Phase ${n.ph}, langer Lauf ${n.L?n.L+" km":"frei"}, Tempo ${n.T} km, locker ${n.E} km, Rad ca. ${n.B} km, Schwimmen ${n.S} m.</p>
<h2>Fahrplan bis Oktober 2027</h2>
<details><summary>Basis: 23. November bis Mitte Februar</summary><p>Läufe wieder aufbauen. Langer Lauf von 8 auf 14 km, locker 5 bis 6 km, Tempo 6 bis 8 km. Ziel: ein 10-km-Testlauf Anfang Februar als Messpunkt.</p></details>
<details><summary>Aufbau: Mitte Februar bis Mitte April</summary><p>Langer Lauf von 14 auf 18 km, Rad bis etwa 60 km, Schwimmen bis 1.700 m. Zwischenziel: ein Halbmarathon im April, als Rennen oder als Testlauf.</p></details>
<details><summary>Triathlon-Phase: Mitte April bis Ende Juni</summary><p>Langer Lauf bleibt bei 20 bis 22 km, Rad 65 bis 70 km, Schwimmen bis 1.850 m. Einmal im Monat nach dem Rad 10 Min locker laufen (Koppeltraining). Der Triathlon sollte in diesem Fenster liegen.</p></details>
<details><summary>Marathon-Block: Ende Juni bis Mitte September</summary><p>Langer Lauf von 22 auf 32 km, Höhepunkt Mitte September. Rad und Schwimmen nur halten. Alle 4 Wochen eine Entlastungswoche.</p></details>
<details><summary>Taper und Marathon: ab 20. September</summary><p>Umfang runter: 22, 18 und 12 km, dann Marathonwoche. Ich gehe von einem Termin Mitte Oktober aus. Sobald das genaue Datum feststeht, passe ich den Block an.</p></details>
<h2>Meine Empfehlungen</h2>
<ul class="t"><li>Locker heißt wirklich locker. Etwa 80 % deiner Läufe im Gesprächstempo, nur der Dienstag ist schnell.</li><li>Jede vierte Woche ist eine Entlastungswoche. Behalte sie, auch wenn du dich gut fühlst.</li><li>Bei Schmerzen, die beim Laufen schlimmer werden, pausieren und abklären lassen. Ein Marathon ist es nicht wert.</li><li>Nach mehr als 10 Tagen Pause eine Woche mit den Zahlen der Vorwoche starten, nicht springen.</li><li>Im PhD zählt in den ersten drei Monaten Regelmäßigkeit mehr als Menge. Wenn eine Woche voll ist, streiche zuerst News und Methoden, nicht Schreiben.</li><li>Verschiebe Einheiten ruhig, aber lege den langen Lauf nie direkt hinter die Tempoeinheit.</li></ul>
<h2>Was mir noch fehlt</h2>
<ul class="t"><li>Datum und Ort des Triathlons.</li><li>Genaues Datum des Marathons und ob du ein Zeitziel hast oder erst einmal ankommen willst.</li><li>Dein Ruhepuls und deine VO2max aus Garmin, damit ich die Tempi genauer setzen kann.</li></ul>
<h2>Daten sichern</h2><p class="chip" style="margin-bottom:8px">Dein Fortschritt liegt nur in diesem Browser. Mit „Daten anzeigen“ bekommst du einen Text, den du dir irgendwo speichern kannst, und mit „Daten laden“ spielst du ihn wieder ein.</p><textarea id="bk" rows="4" aria-label="Sicherung"></textarea><div class="add"><button onclick="bkx()">Daten anzeigen</button><button onclick="bki()">Daten laden</button></div>`;
}
function render(){
 document.getElementById("app").innerHTML=({week:week,day:day,month:month,plan:plan})[tab]();
 ["week","day","month","plan"].forEach((t,i)=>document.getElementById("t"+(i+1)).setAttribute("aria-current",tab===t));
}
render();
</script>
